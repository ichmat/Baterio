name: CI Build & Test & Deploy

on:
  push:
    branches: [ main, dev ]

jobs:
  backend:
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v4
    # - name: ⚒️ Setup .NET
    #   uses: actions/setup-dotnet@v4
    #   with:
    #     dotnet-version: '10.0.x'
    - name: 🏗️ Build Backend
      working-directory: ./backend
      run: dotnet build --configuration Release
    - name: ✅ Test Backend
      working-directory: ./backend
      run: dotnet test --configuration Release --no-build --verbosity normal

  frontend:
    needs: [backend]
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v4
    - name: ⚒️ Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
    - name: ⬇️ Install Frontend
      working-directory: ./frontend
      run: npm ci
    - name: 🏗️ Build Frontend
      working-directory: ./frontend
      run: npm run build
    - name: ✅ Test Frontend
      working-directory: ./frontend
      run: npm run test --if-present

  deploy-dev: 
    needs: [backend, frontend]  # Attend succès des deux jobs tests
    if: github.ref == 'refs/heads/dev'  # Seulement branche dev
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v4
      with:
        ref: dev

    - name: 🏗️ Build Docker images
      run: docker compose build --no-cache

    - name: 🚀 Deploy & clean
      run: docker compose up -d --remove-orphans --force-recreate

services:
  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - VITE_API_BASE_URL=http://192.168.1.221:5000/api
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: BackEnd.API/Dockerfile
      target: build
    command: dotnet watch run --project BackEnd.API/BackEnd.API.csproj --urls "http://0.0.0.0:5000"
    working_dir: /src
    ports:
      - "5000:5000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DOTNET_USE_POLLING_FILE_WATCHER=1
      - ConnectionStrings__DefaultConnection=Server=mysql;Port=3306;Database=${MYSQL_DATABASE:-baterio};User=${MYSQL_USER:-baterio_user};Password=${MYSQL_PASSWORD:-changeme};
      - Cors__Origins=http://192.168.1.221:5173
    volumes:
      - ./backend:/src
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network

  mysql:
    image: mysql:8.4
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-changeme}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-baterio}
      MYSQL_USER: ${MYSQL_USER:-baterio_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

volumes:
  mysql_data:
  frontend_node_modules:

networks:
  app-network:
    driver: bridge
